name: Validate Skills

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml yamllint

      - name: YAML lint
        run: yamllint personal_hub_skills/skills/

      - name: Schema check
        run: python scripts/validate_schema.py personal_hub_skills/skills/

      - name: Markdown lint (methodologies, style_patterns)
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            methodologies/**/*.md
            style_patterns/**/*.md
            prompts/**/*.md
